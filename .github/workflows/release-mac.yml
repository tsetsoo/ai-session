name: Release Mac app

on:
  push:
    branches: [main]
    paths:
      - "ai-session-remote/App/**"
      - "ai-session-remote/Sources/**"
      - "ai-session-remote/AISessionRemote.xcodeproj/**"
      - "ai-session-remote/Package.swift"
      - "ai-session-remote/project.yml"
      - "ai-session-remote/scripts/build-mac-release.sh"
      - "ai-session-remote/scripts/bundle-terminal-browser.sh"
      - "ai-session-remote/licenses/TerminalBrowser.txt"
      - ".github/workflows/release-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # The pinned SwiftTerm fails to type-check its Powerline renderer on Xcode 26.3.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Apple Development identity
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MAC_SIGNING_P12:?Configure MAC_SIGNING_P12 with the team 233QTK6KCL Apple Development identity}"
          keychain="$RUNNER_TEMP/mac-release.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "$MAC_SIGNING_P12" | base64 -D > "$RUNNER_TEMP/mac-release.p12"
          trap 'rm -f "$RUNNER_TEMP/mac-release.p12"' EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/mac-release.p12" -k "$keychain" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

      - name: Build and package universal app
        env:
          AISESSION_RELEASE_REVISION: ${{ github.sha }}
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          set -euo pipefail
          app="$(ai-session-remote/scripts/build-mac-release.sh "$RUNNER_TEMP/derived" ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO)"
          codesign --verify --deep --strict -R '=identifier "com.aisessionremote.mac" and anchor apple generic and certificate leaf[subject.OU] = "233QTK6KCL" and certificate leaf[subject.CN] = "Apple Development:"*' "$app"
          architectures="$(lipo -archs "$app/Contents/MacOS/AI Session Remote")"
          [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
          test -s "$app/Contents/Resources/TerminalBrowser/terminal-browser-darwin-arm64.tar.gz"
          test -s "$app/Contents/Resources/TerminalBrowser/terminal-browser-darwin-x64.tar.gz"
          test "$(plutil -extract AISessionReleaseRevision raw "$app/Contents/Info.plist")" = "$GITHUB_SHA"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ai-session-remote-mac-$GITHUB_SHA.zip"

      - name: Publish rolling Mac release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          built_archive="$RUNNER_TEMP/ai-session-remote-mac-$GITHUB_SHA.zip"
          checksum="$(shasum -a 256 "$built_archive" | cut -d ' ' -f 1)"
          asset="ai-session-remote-mac-$GITHUB_SHA-$checksum.zip"
          archive="$RUNNER_TEMP/$asset"
          mv "$built_archive" "$archive"
          notes="$RUNNER_TEMP/mac-release-notes.json"
          jq -n --arg revision "$GITHUB_SHA" --arg sha256 "$checksum" '{revision: $revision, sha256: $sha256}' > "$notes"
          rolling="$(gh release view mac-latest --json body,assets || true)"
          if [[ -n "$rolling" ]]; then
            previous="$(jq -er '.body | fromjson | .revision | select(test("^[a-f0-9]{40}$"))' <<< "$rolling")"
            [[ "$previous" != "$GITHUB_SHA" ]] || exit 0
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq .status)"
            [[ "$status" == ahead ]] || { echo "Refusing to supersede $previous with $GITHUB_SHA ($status)" >&2; exit 1; }

            # Existing manifests keep pointing at their archive until this upload succeeds.
            if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$rolling" >/dev/null; then
              gh release upload mac-latest "$archive"
            fi
            gh release edit mac-latest --notes-file "$notes"
          else
            gh release create mac-latest "$archive" --notes-file "$notes" \
              --target "$GITHUB_SHA" --title "Mac app (rolling)" --latest=false
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/mac-release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
