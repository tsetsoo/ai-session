# AI Session Remote: tmux settings for Claude Code conversations.
# install.sh copies this to ~/.ai-remote/tmux.conf and sources it from ~/.tmux.conf.
# `-q` keeps older tmux versions quiet about options they don't have.

# Esc reaches Claude immediately instead of waiting for a possible key sequence.
set -sq escape-time 0

# Follow whichever device (iPhone or Mac) was used last when both are attached.
set -gq window-size latest
setw -gq aggressive-resize on

# Shift+Enter and other modified keys reach Claude (tmux 3.2+; csi-u format 3.5+).
set -sq extended-keys on
set -sq extended-keys-format csi-u
set -asq terminal-features 'xterm*:extkeys'

# Copy inside tmux lands on the client's clipboard (OSC 52). `clipboard` makes tmux
# emit that sequence even when the host's xterm-256color entry has no Ms capability.
set -sq set-clipboard on
set -asq terminal-features 'xterm*:clipboard'

# Focus events, mouse scrolling, and long scrollback for long Claude replies.
set -gq focus-events on
set -gq mouse on
set -gq history-limit 50000

# The iPhone scrolls with the finger by sending the wheel with Meta held, one line per
# event (the plain wheel moves five). The first one also enters copy mode, and scrolling
# back to the bottom leaves it, as with the plain wheel.
# The condition nests two-way `||`: tmux before 3.4 reads only two operands.
bind -n M-WheelUpPane if -F "#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}}" { send -M } { copy-mode -e; send -X scroll-up }
bind -T copy-mode M-WheelUpPane send -X scroll-up
bind -T copy-mode M-WheelDownPane send -X scroll-down
bind -T copy-mode-vi M-WheelUpPane send -X scroll-up
bind -T copy-mode-vi M-WheelDownPane send -X scroll-down

# True color.
set -asq terminal-features 'xterm*:RGB'
set -asq terminal-overrides ',xterm*:Tc'
