name: AISessionRemote

options:
  deploymentTarget:
    iOS: "17.0"

packages:
  AISessionRemote:
    path: .
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.15.0"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.81.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"

targets:
  AISessionRemote:
    type: application
    platform: iOS
    sources:
      - path: App/AISessionRemote
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aisessionremote.app
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: AISessionRemote
        product: AISessionCore
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto
    scheme:
      testTargets:
        - AISessionRemoteTests

  AISessionRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/AISessionRemoteTests
    settings:
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: AISessionRemote
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-crypto
        product: Crypto
