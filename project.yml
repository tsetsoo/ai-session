name: AISessionRemote

options:
  deploymentTarget:
    iOS: "17.0"

packages:
  AISessionRemote:
    path: .
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.15.0"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.81.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.18.0"

targets:
  AISessionRemote:
    type: application
    platform: iOS
    sources:
      - path: App/AISessionRemote
        excludes:
          - Info.plist
    info:
      path: App/AISessionRemote/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: AI Session Remote
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aisessionremote.app
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: App/AISessionRemote/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: AISessionRemote
        product: AISessionCore
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto
      - package: SwiftTerm
        product: SwiftTerm
    scheme:
      testTargets:
        - AISessionRemoteTests

  AISessionRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/AISessionRemoteTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: AISessionRemote
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto
