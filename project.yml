name: AISessionRemote

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  AISessionRemote:
    path: .
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.15.0"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.81.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.18.0"

targets:
  AISessionRemote:
    type: application
    platform: iOS
    sources:
      - path: App/AISessionRemote
        excludes:
          - Info.plist
    info:
      path: App/AISessionRemote/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: AI Session Remote
        # In-app dictation in the quick-add field.
        NSMicrophoneUsageDescription: Dictate new todos.
        NSSpeechRecognitionUsageDescription: Turns your dictation into todo text.
        # Home-screen quick action; AppModel routes it through AppDelegate.onShortcutItem.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.aisessionremote.newTodo
            UIApplicationShortcutItemTitle: New Todo
            UIApplicationShortcutItemIconSymbolName: plus
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The todo server is plain http on the tailnet, usually by its 100.x IP. ATS has no
        # per-IP exception and NSAllowsLocalNetworking doesn't cover Tailscale's 100.64/10
        # range, so allow plain http outright; Tailscale encrypts the traffic (WireGuard).
        # Don't add NSAllowsLocalNetworking back: its presence makes ATS ignore this key.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aisessionremote.app
      # aps-environment for push notifications (iOS only; the Mac app has no remote push).
      CODE_SIGN_ENTITLEMENTS: App/AISessionRemote/AISessionRemote.entitlements
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: App/AISessionRemote/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: AISessionRemote
        product: AISessionCore
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto
      - package: SwiftTerm
        product: SwiftTerm
    scheme:
      testTargets:
        - AISessionRemoteTests

  AISessionRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/AISessionRemoteTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: AISessionRemote
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto

  # Native Mac app built from the same sources as the iOS app. A separate target
  # (rather than making AISessionRemote multiplatform) leaves the iOS target's
  # settings untouched. Not sandboxed: it reads keys from ~/.ssh, opens arbitrary
  # outbound SSH connections and uses the login keychain without a signing team.
  AISessionRemoteMac:
    type: application
    platform: macOS
    sources:
      - path: App/AISessionRemote
        excludes:
          - Info.plist
          - Views/Frame/KeyBar.swift
    info:
      path: App/AISessionRemoteMac/Info.plist
      properties:
        CFBundleDisplayName: AI Session Remote
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        # ATS applies to URLSession on macOS too, sandboxed or not. Same reasoning as iOS above.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      PRODUCT_NAME: AI Session Remote
      PRODUCT_BUNDLE_IDENTIFIER: com.aisessionremote.mac
      INFOPLIST_FILE: App/AISessionRemoteMac/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.9"
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
    scheme: {}
    dependencies:
      - package: AISessionRemote
        product: AISessionCore
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto
      - package: SwiftTerm
        product: SwiftTerm
