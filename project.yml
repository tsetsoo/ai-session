name: AISessionRemote

options:
  deploymentTarget:
    iOS: "17.0"

packages:
  AISessionRemote:
    path: .

targets:
  AISessionRemote:
    type: application
    platform: iOS
    sources:
      - path: App/AISessionRemote
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aisessionremote.app
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: AISessionRemote
        product: AISessionCore
